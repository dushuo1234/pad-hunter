<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // GitHub Pages has no history rewrite. 404.html sends /pad-hunter/launched to
      // /pad-hunter/?/launched; restore the path before the app reads location.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&') })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/radar.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="台子雷达 Pad Hunter — Telegram 项目推送与项目推送监控，按链与类型筛选" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>台子雷达 · 项目推送</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
